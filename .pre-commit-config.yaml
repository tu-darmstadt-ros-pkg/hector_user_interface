repos:
  - repo: local
    hooks:
      - id: rviz-no-volatile
        name: Reject volatile rviz UI-state
        description: >-
          Block commits whose staged .rviz files have blacklisted volatile UI-state that
          drifts from the committed value (see tools/rviz_blacklist.txt). Run
          tools/clean_rviz_configs.sh to reset it.
        entry: python3 tools/rviz_normalize.py --check
        language: system
        files: \.rviz$

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v21.1.7
    hooks:
      - id: clang-format
        name: Clang Format
        args: [--style=file]
        files: \.(cpp|hpp|h|c|cc)$

  - repo: local
    hooks:
      - id: cppcheck
        name: Cppcheck
        entry: bash -c "cppcheck --force --library=qt --quiet --inline-suppr --error-exitcode=1 --language=c++ $(find . -type d \( -name 'cmake-build-*' -o -name 'third_party' \) -prune -false -o -name '*.cpp' -o -name '*.hpp' -o -name '*.h' -o -name '*.c' -o -name '*.cc')"
        language: system
        files: \.(cpp|cc|hpp|h)$
        pass_filenames: false

  - repo: local
    hooks:
      - id: qmlformat
        name: qmlformat
        entry: qmlformat
        language: system
        pass_filenames: true
        # The -i flag formats the file in-place
        # The optional -n flag normalizes the object attribute order based on Qt conventions
        args: [-n, -i]
        files: \.qml$
